name: acks
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: acks
      POSTGRES_USER: acks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acks -d acks"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *logging
    networks: [private]
  migrate:
    image: acks-migrate:${RELEASE_TAG:-local}
    build:
      context: ./backend
      target: migrate
    environment:
      DATABASE_URL: postgresql://acks:${POSTGRES_PASSWORD}@db:5432/acks?connection_limit=10&pool_timeout=10&connect_timeout=5
    depends_on:
      db: { condition: service_healthy }
    networks: [private]
    logging: *logging
  api:
    image: acks-api:${RELEASE_TAG:-local}
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      DATABASE_URL: postgresql://acks:${POSTGRES_PASSWORD}@db:5432/acks?connection_limit=10&pool_timeout=10&connect_timeout=5
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
      CORS_ORIGIN: https://${APP_DOMAIN:?Configure APP_DOMAIN}
      PUBLIC_APP_URL: https://${APP_DOMAIN}
      TRUST_PROXY: 172.30.0.10/32
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [private]
    logging: *logging
  web:
    image: acks-web:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Configure ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    networks:
      private:
        ipv4_address: 172.30.0.10
    logging: *logging
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
networks:
  private:
    ipam:
      config:
        - subnet: 172.30.0.0/24
