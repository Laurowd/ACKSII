services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: acks_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: acks_test
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acks_test -d acks_test"]
      interval: 2s
      timeout: 5s
      retries: 20
    # Disposable data, separate from the application's deployment volumes.
    tmpfs:
      - /var/lib/postgresql/data
