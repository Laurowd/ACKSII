name: CI
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: acks_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: acks_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U acks_test -d acks_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://acks_test:local-test-only@127.0.0.1:5432/acks_test
      DATABASE_URL: postgresql://acks_test:local-test-only@127.0.0.1:5432/acks_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Validate production preflight rules
        run: node --test scripts/preflight.test.cjs scripts/backup-cipher.test.cjs scripts/monitor-production.test.cjs scripts/load-config.test.cjs scripts/production-load-config.test.cjs
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install frontend dependencies without the Cypress executable
        env:
          CYPRESS_INSTALL_BINARY: "0"
        run: npm ci --prefix frontend
      - run: npm run prisma:generate --prefix backend
      - run: npm run build --prefix backend && npm run build --prefix frontend
      - name: Check compiled Vercel entrypoint and static frontend
        run: node scripts/check-vercel-build.cjs
      - run: npm test --prefix backend && npm test --prefix frontend
      - run: npm audit --prefix backend --audit-level=moderate && npm audit --prefix frontend --audit-level=moderate
      - run: npm run test:integration --prefix backend
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox
      - name: Install and verify Cypress executable
        working-directory: frontend
        run: |
          npx cypress install
          npx cypress verify
      - run: npm run test:e2e --prefix frontend
      - name: Firefox session, rewards, descriptions and production CSP
        env:
          PLAYWRIGHT_BROWSER: firefox
        run: npm run test:e2e --prefix frontend -- rewards.spec.ts interface.spec.ts session-improvements.spec.ts class-choices.spec.ts additional-rules.spec.ts rule-interactions.spec.ts --grep-invert "touch help"
      - name: Cypress with local API, SMTP and PostgreSQL
        run: npm run test:cypress --prefix frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            frontend/test-results
            frontend/cypress/results
            frontend/cypress/screenshots
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: local
            compose_files: compose.yml:compose.test.yml
          - database: external
            compose_files: compose.neon.yml:compose.neon.test.yml
    env:
      COMPOSE_FILE: ${{ matrix.compose_files }}
      APP_DOMAIN: localhost
      ACME_EMAIL: ci@example.com
      POSTGRES_PASSWORD: disposabletestpassword
      JWT_SECRET: disposable-ci-secret-at-least-32-characters
      RELEASE_TAG: ci
      DATABASE_URL: postgresql://acks_test:local-test-only@db:5432/acks_test
      DIRECT_DATABASE_URL: postgresql://acks_test:local-test-only@db:5432/acks_test
    steps:
      - uses: actions/checkout@v5
      - name: Validate deployment configuration
        run: docker compose -p acks-ci config --quiet
      - name: Build and start isolated deployment
        run: docker compose -p acks-ci up -d --build --wait --wait-timeout 180
      - name: Verify proxy, SPA fallback, readiness and headers
        run: |
          curl --fail http://localhost/api/ready
          curl --fail http://localhost/character/deep-link | grep '<div id="app">'
          curl --fail -I http://localhost/login | grep -i 'content-security-policy'
      - name: Backup and restore into a separate database
        if: matrix.database == 'local'
        env:
          ACKS_COMPOSE_PROJECT: acks-ci
          ACKS_COMPOSE_ENV_FILE: none
        run: |
          node scripts/backup.cjs create backup-ci.dump
          node scripts/backup.cjs verify backup-ci.dump
      - name: Export external database and verify in a network-isolated container
        if: matrix.database == 'external'
        env:
          ACKS_NEON_ENV_FILE: none
          ACKS_BACKUP_NETWORK: acks-ci_private
        run: |
          node scripts/backup-neon.cjs create backup-external-ci.dump
          node scripts/backup-neon.cjs verify backup-external-ci.dump
      - name: Logs and cleanup of disposable CI project
        if: always()
        run: |
          docker compose -p acks-ci logs --tail 100 || true
          docker compose -p acks-ci down --volumes --remove-orphans
