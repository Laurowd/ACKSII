name: acks-neon
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  migrate:
    image: acks-migrate:${RELEASE_TAG:-local}
    build:
      context: ./backend
      target: migrate
    environment:
      DATABASE_URL: ${DIRECT_DATABASE_URL:?Configure DIRECT_DATABASE_URL}
    networks: [private]
    logging: *logging
  api:
    image: acks-api:${RELEASE_TAG:-local}
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
      CORS_ORIGIN: https://${APP_DOMAIN:?Configure APP_DOMAIN}
      PUBLIC_APP_URL: https://${APP_DOMAIN}
      TRUST_PROXY: 172.30.0.10/32
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [private]
    logging: *logging
  web:
    image: acks-web:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Configure ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    networks:
      private:
        ipv4_address: 172.30.0.10
    logging: *logging
volumes:
  caddy_data:
  caddy_config:
networks:
  private:
    ipam:
      config:
        - subnet: 172.30.0.0/24
